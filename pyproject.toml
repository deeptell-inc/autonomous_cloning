[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acloner"
version = "0.1.0"
description = "Closed-form autonomous optimal phase-covariant cloners on spin networks (reproducibility package)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "sympy>=1.12", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["acloner"]
